"""Build the exes and refresh the rolling 'latest' release.

Runs after every push to main: pytest as a gate, then build.bat, then the
two exes replace the assets on the 'latest' release (created on first run,
tag moved to the fresh commit). The Releases page always serves the
current build at .../releases/latest.
"""
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  latest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (gate)
        run: python -m pytest -q

      - name: Build exes
        run: cmd /c build.bat

      - name: Move the latest tag to this commit
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Create the latest release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --repo $env:GITHUB_REPOSITORY `
              --title "Latest build" --notes "Current build from main."
          }

      - name: Write SHA256SUMS.txt
        run: |
          $lines = Get-FileHash dist\valt.exe, dist\valt-cli.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding ascii

      - name: Replace the exes on the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest dist\valt.exe dist\valt-cli.exe dist\SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY --clobber
