# Build the exes and refresh the rolling 'latest' release.
# Runs after every push to main: pytest as a gate, then build.bat, then the
# exes + SHA256SUMS.txt + zip replace the assets on the 'latest' release,
# and the scoop manifest version is bumped back onto main.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  latest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (gate)
        run: python -m pytest -q

      - name: Build exes
        run: cmd /c build.bat

      - name: Move the latest tag to this commit
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Create the latest release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --repo $env:GITHUB_REPOSITORY `
              --title "Latest build" --notes "Current build from main."
          }

      - name: Zip the exes
        run: Compress-Archive dist\valt.exe, dist\valt-cli.exe, dist\valt-doc.ico -DestinationPath dist\valt.zip -Force

      - name: Write SHA256SUMS.txt
        run: |
          $lines = Get-FileHash dist\valt.exe, dist\valt-cli.exe, dist\valt.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding ascii

      - name: Write release notes
        run: |
          @'
          **Install - PowerShell (one line):**

          ```powershell
          irm https://raw.githubusercontent.com/Stellar5055/Valt/main/install.ps1 | iex
          ```

          **Install - Scoop:**

          ```powershell
          scoop install https://raw.githubusercontent.com/Stellar5055/Valt/main/bucket/valt.json
          ```

          **Manual:** download `valt.exe` (GUI) or `valt-cli.exe` (command line) below.

          Forgotten passwords can never be recovered.
          '@ | Set-Content notes.md -Encoding ascii

      - name: Replace the exes on the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest dist\valt.exe dist\valt-cli.exe dist\valt.zip dist\SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY --clobber

      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit latest --repo $env:GITHUB_REPOSITORY --notes-file notes.md

      - name: Bump the scoop manifest version and hash
        run: |
          $version = "$(Get-Date -Format 'yyyy.MM.dd')-$($env:GITHUB_SHA.Substring(0, 7))"
          $zipHash = (Get-FileHash dist\valt.zip -Algorithm SHA256).Hash.ToLower()
          @"
          {
            "version": "$version",
            "url": "https://github.com/Stellar5055/Valt/releases/latest/download/valt.zip",
            "bin": ["valt.exe", "valt-cli.exe"],
            "shortcuts": [
              ["valt.exe", "Valt"],
              ["valt-cli.exe", "Valt CLI"]
            ],
            "hash": "$zipHash"
          }
          "@ | Set-Content bucket\valt.json -Encoding ascii
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket\valt.json
          git diff --staged --quiet || (git commit -m "scoop: bump manifest to $version [skip ci]" && git push)

      - name: Verify the irm installer (standalone path)
        run: |
          .\install.ps1 -Source dist
          & "$env:LOCALAPPDATA\Valt\valt-cli.exe" --help
